name: Build Release APK for Myket

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Workspace and Keystore
        run: |
          shopt -s nullglob
          zip_files=(*.zip)
          if [ ${#zip_files[@]} -gt 0 ]; then
            unzip -o "${zip_files[0]}"
          fi

          find . -path "*/src/*" -name "*.jks" -delete 2>/dev/null || true
          find . -path "*/res/*" -name "*.jks" -delete 2>/dev/null || true
          find . -path "*/src/*" -name "*.keystore" -delete 2>/dev/null || true
          find . -path "*/res/*" -name "*.keystore" -delete 2>/dev/null || true
          rm -f my-upload-key.jks debug.keystore

          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 12345678 \
            -keypass 12345678 \
            -dname "CN=RevayatMaa, OU=Mobile, O=Revayat, L=Tehran, C=IR"

          mkdir -p app
          cp my-upload-key.jks app/my-upload-key.jks 2>/dev/null || true

          cat << 'EOF' >> gradle.properties
          storeFile=my-upload-key.jks
          storePassword=12345678
          keyAlias=upload
          keyPassword=12345678
          KEYSTORE_PASSWORD=12345678
          KEY_PASSWORD=12345678
          KEY_ALIAS=upload
          MYAPP_UPLOAD_STORE_FILE=my-upload-key.jks
          MYAPP_UPLOAD_STORE_PASSWORD=12345678
          MYAPP_UPLOAD_KEY_ALIAS=upload
          MYAPP_UPLOAD_KEY_PASSWORD=12345678
          EOF

          mkdir -p ~/.gradle
          cp gradle.properties ~/.gradle/gradle.properties

          python3 - << 'PYEOF'
          import os, re
          for root, dirs, files in os.walk("."):
              if "res" in root or "build" in root:
                  continue
              for f in files:
                  if f.startswith("build.gradle"):
                      p = os.path.join(root, f)
                      with open(p, "r", encoding="utf-8", errors="ignore") as fp:
                          lines = fp.readlines()
                      new_lines = []
                      for line in lines:
                          if re.search(r'signingConfig\s*(=|\()', line) or line.strip().startswith("signingConfig "):
                              new_lines.append("// " + line)
                          else:
                              new_lines.append(line)
                      with open(p, "w", encoding="utf-8") as fp:
                          fp.writelines(new_lines)
          print("Signing configs prepared.")
          PYEOF

      - name: Build Android Release
        env:
          KEYSTORE_PASSWORD: "12345678"
          KEY_PASSWORD: "12345678"
          KEY_ALIAS: "upload"
          STORE_PASSWORD: "12345678"
        run: |
          find . -path "*/res/*" -name "*.jks" -delete 2>/dev/null || true

          GRADLE_CMD="gradle"
          GRADLEW_FILE=$(find . -name "gradlew" -type f | head -n 1)

          if [ -n "$GRADLEW_FILE" ] && [ -f "$GRADLEW_FILE" ]; then
            echo "Using gradlew found at: $GRADLEW_FILE"
            chmod +x "$GRADLEW_FILE"
            GRADLE_CMD="$GRADLEW_FILE"
          else
            echo "Using system gradle directly."
          fi

          $GRADLE_CMD assembleRelease --no-daemon -x test -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: Sign APK with Official Release Key
        run: |
          APK_RAW=$(find . -path "*/outputs/apk/*" -name "*.apk" | head -n 1)
          if [ -z "$APK_RAW" ]; then
            APK_RAW=$(find . -name "*.apk" | head -n 1)
          fi

          echo "Found APK: $APK_RAW"

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          $APKSIGNER sign --ks my-upload-key.jks \
            --ks-key-alias upload \
            --ks-pass pass:12345678 \
            --key-pass pass:12345678 \
            --out RevayatMaa-Release.apk \
            "$APK_RAW"

          $APKSIGNER verify RevayatMaa-Release.apk
          echo "APK successfully verified and signed!"

      - name: Upload Final Release Package
        uses: actions/upload-artifact@v4
        with:
          name: RevayatMaa-Release-Package
          path: |
            RevayatMaa-Release.apk
            my-upload-key.jks
          if-no-files-found: error
          
