name: Build Release APK for Myket

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Workspace and Keystore
        run: |
          shopt -s nullglob
          zip_files=(*.zip)
          if [ ${#zip_files[@]} -gt 0 ]; then
            unzip -o "${zip_files[0]}"
          fi

          WORKDIR="$GITHUB_WORKSPACE"
          cd "$WORKDIR"

          find . -path "*/src/*" -name "*.jks" -delete 2>/dev/null || true
          find . -path "*/res/*" -name "*.jks" -delete 2>/dev/null || true
          find . -path "*/src/*" -name "*.keystore" -delete 2>/dev/null || true
          find . -path "*/res/*" -name "*.keystore" -delete 2>/dev/null || true

          STORE_PASS=$(grep -r "storePassword" . 2>/dev/null | head -n 1 | sed -E 's/.*["'"'"']([^"'"'"']+)["'"'"'].*/\1/' || true)
          KEY_PASS=$(grep -r "keyPassword" . 2>/dev/null | head -n 1 | sed -E 's/.*["'"'"']([^"'"'"']+)["'"'"'].*/\1/' || true)
          KEY_ALIAS=$(grep -r "keyAlias" . 2>/dev/null | head -n 1 | sed -E 's/.*["'"'"']([^"'"'"']+)["'"'"'].*/\1/' || true)

          [ -z "$STORE_PASS" ] && STORE_PASS="12345678"
          [ -z "$KEY_PASS" ] && KEY_PASS="12345678"
          [ -z "$KEY_ALIAS" ] && KEY_ALIAS="upload"

          rm -f "$WORKDIR/my-upload-key.jks"
          keytool -genkeypair -v \
            -keystore "$WORKDIR/my-upload-key.jks" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=RevayatMaa, OU=Mobile, O=Revayat, L=Tehran, C=IR"

          cp "$WORKDIR/my-upload-key.jks" "$WORKDIR/app/my-upload-key.jks" 2>/dev/null || true

      - name: Compile and Package APK
        run: |
          WORKDIR="$GITHUB_WORKSPACE"
          find "$WORKDIR" -path "*/res/*" -name "*.jks" -delete 2>/dev/null || true

          GRADLEW_PATH=$(find "$WORKDIR" -name "gradlew" -type f | head -n 1)

          if [ -n "$GRADLEW_PATH" ]; then
            chmod +x "$GRADLEW_PATH"
            cd "$(dirname "$GRADLEW_PATH")"
            ./gradlew assembleRelease --no-daemon -x test -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease
          else
            cd "$WORKDIR"
            gradle assembleRelease --no-daemon -x test -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease
          fi

      - name: Finalize and Verify Signature
        run: |
          WORKDIR="$GITHUB_WORKSPACE"
          APK_RAW=$(find "$WORKDIR" -path "*/outputs/apk/*" -name "*.apk" | head -n 1)
          if [ -z "$APK_RAW" ]; then
            APK_RAW=$(find "$WORKDIR" -name "*.apk" | head -n 1)
          fi

          echo "Target APK found: $APK_RAW"
          cp "$APK_RAW" "$WORKDIR/RevayatMaa-Release.apk"

          STORE_PASS=$(grep -r "storePassword" "$WORKDIR" 2>/dev/null | head -n 1 | sed -E 's/.*["'"'"']([^"'"'"']+)["'"'"'].*/\1/' || true)
          KEY_PASS=$(grep -r "keyPassword" "$WORKDIR" 2>/dev/null | head -n 1 | sed -E 's/.*["'"'"']([^"'"'"']+)["'"'"'].*/\1/' || true)
          KEY_ALIAS=$(grep -r "keyAlias" "$WORKDIR" 2>/dev/null | head -n 1 | sed -E 's/.*["'"'"']([^"'"'"']+)["'"'"'].*/\1/' || true)

          [ -z "$STORE_PASS" ] && STORE_PASS="12345678"
          [ -z "$KEY_PASS" ] && KEY_PASS="12345678"
          [ -z "$KEY_ALIAS" ] && KEY_ALIAS="upload"

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          if ! $APKSIGNER verify "$WORKDIR/RevayatMaa-Release.apk" 2>/dev/null; then
            $APKSIGNER sign --ks "$WORKDIR/my-upload-key.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --out "$WORKDIR/RevayatMaa-Signed.apk" "$WORKDIR/RevayatMaa-Release.apk"
            mv "$WORKDIR/RevayatMaa-Signed.apk" "$WORKDIR/RevayatMaa-Release.apk"
          fi

      - name: Upload Final Release Package
        uses: actions/upload-artifact@v4
        with:
          name: RevayatMaa-Release-Package
          path: |
            RevayatMaa-Release.apk
            my-upload-key.jks
          if-no-files-found: error
          
