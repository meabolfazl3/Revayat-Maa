name: Build Release APK for Myket

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Workspace and Keystore
        run: |
          shopt -s nullglob
          zip_files=(*.zip)
          if [ ${#zip_files[@]} -gt 0 ]; then
            unzip -o "${zip_files[0]}"
          fi

          WORKDIR="$GITHUB_WORKSPACE"
          cd "$WORKDIR"

          # پاکسازی فایل‌های تداخلی
          find . -path "*/src/*" -name "*.jks" -delete 2>/dev/null || true
          find . -path "*/res/*" -name "*.jks" -delete 2>/dev/null || true
          rm -f "$WORKDIR/my-upload-key.jks"

          # ساخت فیزیکی فایل کلید با رمزهای استاندارد و مشخص
          # تمام رمزها عمداً "12345678" و الیاس "upload" تنظیم می‌شوند تا گرادل به راحتی آن‌ها را قبول کند.
          keytool -genkeypair -v \
            -keystore "$WORKDIR/my-upload-key.jks" \
            -alias "upload" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "12345678" \
            -keypass "12345678" \
            -dname "CN=RevayatMaa, OU=Mobile, O=Revayat, L=Tehran, C=IR"

          # قرار دادن کلید دقیقاً در مسیر app (نه داخل res)
          cp "$WORKDIR/my-upload-key.jks" "$WORKDIR/app/my-upload-key.jks" 2>/dev/null || true

      - name: Compile and Package APK with Explicit Signing
        run: |
          WORKDIR="$GITHUB_WORKSPACE"
          
          # اطمینان از پاکسازی res قبل از بیلد
          find "$WORKDIR" -path "*/res/*" -name "*.jks" -delete 2>/dev/null || true

          GRADLEW_PATH=$(find "$WORKDIR" -name "gradlew" -type f | head -n 1)
          [ -z "$GRADLEW_PATH" ] && GRADLEW_PATH="$WORKDIR/gradlew"

          chmod +x "$GRADLEW_PATH"
          cd "$(dirname "$GRADLEW_PATH")"

          # این دستور، دقیقاً و مستقیماً رمزها را به گرادل تزریق می‌کند تا جلوی ارور را بگیرد.
          ./gradlew assembleRelease \
            -Pandroid.signingConfigs.release.storeFile=my-upload-key.jks \
            -Pandroid.signingConfigs.release.storePassword=12345678 \
            -Pandroid.signingConfigs.release.keyAlias=upload \
            -Pandroid.signingConfigs.release.keyPassword=12345678 \
            --no-daemon -x test -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: Verify Signature and Prepare Package
        run: |
          WORKDIR="$GITHUB_WORKSPACE"
          APK_RAW=$(find "$WORKDIR" -path "*/outputs/apk/*" -name "*.apk" | head -n 1)
          if [ -z "$APK_RAW" ]; then
            APK_RAW=$(find "$WORKDIR" -name "*.apk" | head -n 1)
          fi

          echo "Found APK at: $APK_RAW"
          # کپی فایل نهایی با نام درست
          cp "$APK_RAW" "$WORKDIR/RevayatMaa-Release.apk"

      - name: Upload Final Release Package
        uses: actions/upload-artifact@v4
        with:
          name: RevayatMaa-Release-Package
          path: |
            RevayatMaa-Release.apk
            my-upload-key.jks
          if-no-files-found: error
          
