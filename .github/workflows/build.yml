name: Build Release APK for Myket

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release
        run: |
          chmod +x gradlew
          # حذف فایل‌های تداخلی و موقت دیباگ
          rm -f debug.keystore
          # بیلد اختصاصی نسخه نهایی بدون ورود به فرآیند دیباگ و تست‌ها
          ./gradlew assembleRelease --no-daemon -x test -x lint

      - name: Sign APK with Release Key
        run: |
          # ساخت کی‌استور اختصاصی رلیز در صورت عدم وجود
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v -keystore release.keystore -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 -storepass 12345678 -keypass 12345678 -dname "CN=RevayatMaa, OU=Mobile, O=Revayat, L=Tehran, C=IR"
          fi
          
          # پیدا کردن فایل APK خروجی
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          
          # ابزار امضا از اندروید SDK
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          
          # امضای رسمی با کلید نهایی
          $APKSIGNER sign --ks release.keystore --ks-key-alias releaseKey --ks-pass pass:12345678 --key-pass pass:12345678 --out app-release-final.apk "$APK_FILE"
          echo "APK successfully signed!"

      - name: Upload Final Release APK & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: RevayatMaa-Release-Package
          path: |
            app-release-final.apk
            release.keystore
          if-no-files-found: warn
          
